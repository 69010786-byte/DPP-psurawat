<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tab</title>
</head>
<body>
    <table style="width: 100%; height: 120px; border: 1px solid black; border-collapse: collapse;">
        <tr>
            <td style="width: 50%; background-color: rgb(148, 231, 226); vertical-align: middle;">First cell</td>
            <td style="width: 50%; background-color: rgb(230, 231, 148); vertical-align: middle;">Second cell</td>
        </tr>
    </table>
    
</body>
</html>
